<style>
body {
    font-family: Arial, sans-serif;

}
.container {
    display: flex;
    flex-wrap: wrap;
}
.left-column, .middle-column, .right-column {
    border-right: 1px solid #ccc;
    box-sizing: border-box;
}
.left-column {
    flex: 30%;
    padding: 10px;
}
.middle-column, .right-column {
    flex: 35%;
    padding: 10px;
}
.row {
    display: flex;
    align-items: center;
    border-bottom: 1px solid #ccc;
    padding: 10px 0;
}
.left-column div, .middle-column div, .right-column div {
    margin-bottom: 0;
}
.left-column div {
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.left-column div small {
    display: block;
    margin-top: 5px;
    font-size: 0.8em;
    color: gray;
}
img {
    width: 100%;
    height: auto;
}
.filter-bar {
    display: flex;
    justify-content: space-between;
    padding: 10px 20px; /* Increased side padding */
    background-color: #f8f9fa;
    border-bottom: 1px solid #ccc;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
}
.filter-bar select {
    padding: 5px;
    font-size: 0.9em; /* Decreased font size */
}
.filter-bar div {
    font-size: 0.9em; /* Decreased font size */
}
#content {
    margin-top: 60px;
}
</style>

const contentDiv = document.getElementById('content');

function renderRows(rows) {
    contentDiv.innerHTML = '';
    rows.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'container row';
        rowDiv.innerHTML = `
            <div class="left-column">
                <div>
                    <a href="${row.URL}">${row.ID} - ${row['LUT Name']}</a>
                    <small>Likes: ${row.Likes} | Downloads: ${row.Downloads}</small>
                    <small>Gamma: ${row.Gamma}</small>
                    <small>Color: ${row.Color}</small>
                    <small>Key: ${row.Key}</small>
                    <small>Style: ${row.Style}</small>
                    <small>Author: <a href="${row['Author Profile Link']}">${row['Author Name']}</a></small>
                </div>
            </div>
            <div class="middle-column">
                <div>
                    <img src="${row['Before Photo Link']}" alt="Before Photo">
                </div>
            </div>
            <div class="right-column">
                <div>
                    <img src="${row['After Photo Link']}" alt="After Photo">
                </div>
            </div>
        `;
        contentDiv.appendChild(rowDiv);
    });
}

function applyFilter(gamma, color, key, style) {
    let rows = [...data];
    if (gamma !== 'all') {
        rows = rows.filter(row => row.Gamma === gamma);
    }
    if (color !== 'all') {
        rows = rows.filter(row => row.Color === color);
    }
    if (key !== 'all') {
        rows = rows.filter(row => row.Key === key);
    }
    if (style !== 'all') {
        rows = rows.filter(row => row.Style === style);
    }
    return rows;
}

function updateFilterCounts() {
    const gammaSelect = document.getElementById('gamma-select');
    const colorSelect = document.getElementById('color-select');
    const keySelect = document.getElementById('key-select');
    const styleSelect = document.getElementById('style-select');

    const selects = [gammaSelect, colorSelect, keySelect, styleSelect];
    
    selects.forEach((select, index) => {
        const selectedValue = select.value;
        const options = Array.from(select.options);
        options.forEach(option => {
            const gamma = index === 0 ? option.value : gammaSelect.value;
            const color = index === 1 ? option.value : colorSelect.value;
            const key = index === 2 ? option.value : keySelect.value;
            const style = index === 3 ? option.value : styleSelect.value;
            const filteredRows = applyFilter(gamma, color, key, style);
            option.text = `${option.value} (${filteredRows.length})`;
        });
        select.value = selectedValue;
    });
}

function sortAndFilter() {
    const sortSelect = document.getElementById('sort-select');
    const sortOrderSelect = document.getElementById('sort-order-select');
    const gammaSelect = document.getElementById('gamma-select');
    const colorSelect = document.getElementById('color-select');
    const keySelect = document.getElementById('key-select');
    const styleSelect = document.getElementById('style-select');

    let rows = applyFilter(gammaSelect.value, colorSelect.value, keySelect.value, styleSelect.value);

    if (sortSelect.value === 'id') {
        rows.sort((a, b) => sortOrderSelect.value === 'asc' ? a.ID - b.ID : b.ID - a.ID);
    } else if (sortSelect.value === 'likes') {
        rows.sort((a, b) => sortOrderSelect.value === 'asc' ? a.Likes - b.Likes : b.Likes - a.Likes);
    } else if (sortSelect.value === 'downloads') {
        rows.sort((a, b) => sortOrderSelect.value === 'asc' ? a.Downloads - b.Downloads : b.Downloads - a.Downloads);
    }

    renderRows(rows);
    updateFilterCounts();
}

document.getElementById('sort-select').addEventListener('change', sortAndFilter);
document.getElementById('sort-order-select').addEventListener('change', sortAndFilter);
document.getElementById('gamma-select').addEventListener('change', sortAndFilter);
document.getElementById('color-select').addEventListener('change', sortAndFilter);
document.getElementById('key-select').addEventListener('change', sortAndFilter);
document.getElementById('style-select').addEventListener('change', sortAndFilter);

// Initial render
sortAndFilter();
</script>
